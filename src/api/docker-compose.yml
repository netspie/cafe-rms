services:
  postgres:
    image: postgres:18-alpine
    container_name: cafe-rms-postgres
    environment:
      POSTGRES_DB: cafe_rms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_rms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-rms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Database=cafe_rms;Username=postgres;Password=postgres"
    ports:
      - "5179:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
